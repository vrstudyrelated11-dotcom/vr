<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Card For Anshika</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ff758c,#ff7eb3);
    }

    .heart{
      position:absolute;
      color:white;
      font-size:22px;
      animation:float 6s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-100vh) scale(1.5);
      }
    }

    .card{
      width:420px;
      background:white;
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      position:relative;
      z-index:10;
    }

    .main-heart{
      font-size:70px;
      animation:beat 1s infinite;
    }

    @keyframes beat{
      0%{transform:scale(1);}
      50%{transform:scale(1.2);}
      100%{transform:scale(1);}
    }

    h1{
      color:#ff2e63;
      margin-top:10px;
      margin-bottom:15px;
      font-size:35px;
    }

    p{
      color:#444;
      font-size:18px;
      line-height:1.6;
    }

    .question-box{
      margin-top:25px;
      background:#fff0f5;
      padding:20px;
      border-radius:20px;
    }

    #options{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:12px;
    }

    .question-title{
      font-size:18px;
      color:#d81b60;
      margin-bottom:12px;
      font-weight:700;
    }

    .question{
      font-size:22px;
      color:#ff2e63;
      margin-bottom:20px;
      font-weight:bold;
    }

    .btn{
      padding:12px 25px;
      border:none;
      border-radius:30px;
      cursor:pointer;
      font-size:17px;
      margin:10px;
      color:white;
      transition:0.3s;
    }

    .yes{
      background:#ff2e63;
    }

    .no{
      background:#555;
    }

    .btn:hover{
      transform:scale(1.1);
    }

    #loveMessage{
      display:none;
      margin-top:25px;
      animation:fade 1s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }

    .love-text{
      font-size:24px;
      color:#ff2e63;
      font-weight:bold;
      margin-top:15px;
    }

    .footer{
      margin-top:20px;
      color:#666;
      font-size:17px;
    }

  </style>
</head>

<body>

  <!-- Floating Hearts -->
  <div class="heart" style="left:10%; animation-delay:0s;">❤️</div>
  <div class="heart" style="left:25%; animation-delay:2s;">💖</div>
  <div class="heart" style="left:40%; animation-delay:4s;">💕</div>
  <div class="heart" style="left:60%; animation-delay:1s;">💘</div>
  <div class="heart" style="left:80%; animation-delay:3s;">💞</div>

  <div class="card">

    <div class="main-heart">❤️</div>

    <h1>Anshika</h1>

    <!-- Question Section -->
    <div class="question-box">

      <div class="question-title">meri gf banne ki conditions</div>

      <div class="question" id="questionText">
      </div>

      <div id="options">
        <button class="btn yes" id="yesBtn">Yes ❤️</button>
        <button class="btn no" id="noBtn">No 😢</button>
      </div>

    </div>

    <!-- Final Love Message -->
    <div id="loveMessage">

      <div class="love-text">
        i love you my cute little pussy cat
      </div>

      <p style="margin-top:15px;">
        Thank you for being the best part of my life, Anshika 💕
      </p>

    </div>

    <div class="footer">
      Made With Love 💌
    </div>

  </div>

  <script>

    // Questions array (from user)
    const questions = [
      "kya tum mujhse pyar karti ho?",
      "tum sare ladko to including college or game wale ko hata ke meri bano gi",
      "tum meri sari baat mano gi without arguing?",
      "or jab boluga tab dikhao gi?"
    ];

    let current = 0;
    const questionText = document.getElementById('questionText');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const options = document.getElementById('options');

    function showQuestion(){
      questionText.textContent = questions[current];
    }

    yesBtn.addEventListener('click', function(){
      current++;
      if(current >= questions.length){
        document.getElementById('loveMessage').style.display = 'block';
        document.querySelector('.question-box').style.display = 'none';
      } else {
        showQuestion();
      }
    });

    // No-button jump: fast and avoids the Yes button
    noBtn.style.transition = 'transform 0.06s linear';
    noBtn.style.willChange = 'transform';

    function jumpNoAway(cursorX, cursorY){
      const rect = noBtn.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const optRect = options.getBoundingClientRect();
      let attempt = 0;
      let offsetX = 0, offsetY = 0;
      while(attempt < 40){
        offsetX = Math.floor(Math.random() * 260) - 130; // wider horizontal range
        offsetY = Math.floor(Math.random() * 120) - 20; // allow up/down
        const newLeft = rect.left + offsetX;
        const newRight = rect.right + offsetX;
        const newTop = rect.top + offsetY;
        const newBottom = rect.bottom + offsetY;
        // bounds check inside options
        if(newLeft < optRect.left + 6 || newRight > optRect.right - 6 || newTop < optRect.top + 6 || newBottom > optRect.bottom - 6){
          attempt++; continue;
        }
        // avoid overlapping Yes
        const overlapYes = !(newRight < yesRect.left || newLeft > yesRect.right || newBottom < yesRect.top || newTop > yesRect.bottom);
        if(overlapYes){ attempt++; continue; }
        // avoid being too close to cursor
        if(typeof cursorX === 'number'){
          const cx = newLeft + noBtn.offsetWidth/2;
          const cy = newTop + noBtn.offsetHeight/2;
          const dx = cx - cursorX, dy = cy - cursorY;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < 160){ attempt++; continue; }
        }
        break;
      }
      noBtn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    options.addEventListener('mousemove', function(e){
      const btnRect = noBtn.getBoundingClientRect();
      const cx = btnRect.left + btnRect.width/2;
      const cy = btnRect.top + btnRect.height/2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 140){ jumpNoAway(e.clientX, e.clientY); }
    });

    noBtn.addEventListener('mouseover', function(e){ jumpNoAway(e.clientX, e.clientY); });

    // initialize
    showQuestion();

  </script>

</body>
</html>
